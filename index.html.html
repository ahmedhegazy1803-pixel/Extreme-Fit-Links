<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>XTREME FIT | Official Links</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,255,255,.08), transparent 34%),
        linear-gradient(180deg, #171717 0%, #090909 100%);
      color: #fff;
      display: flex;
      justify-content: center;
    }
    .page {
      width: 100%;
      max-width: 520px;
      min-height: 100vh;
      padding: 42px 22px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: contain;
      background: #111;
      border: 2px solid rgba(255,255,255,.16);
      margin-bottom: 18px;
    }
    .brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-align: center;
    }
    .tagline {
      margin-top: 8px;
      color: #bdbdbd;
      font-size: 13px;
      letter-spacing: 2px;
      text-align: center;
      text-transform: uppercase;
    }
    .links {
      width: 100%;
      margin-top: 32px;
      display: grid;
      gap: 14px;
    }
    .link {
      text-decoration: none;
      color: #fff;
      min-height: 68px;
      padding: 10px 18px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.11);
      box-shadow: 0 8px 25px rgba(0,0,0,.22);
      transition: transform .18s ease, background .18s ease;
    }
    .link:hover { transform: translateY(-2px); background: rgba(255,255,255,.12); }
    .icon {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 23px;
      font-weight: 900;
    }
    .facebook { background: #1877f2; }
    .instagram { background: linear-gradient(135deg,#feda75,#d62976,#962fbf,#4f5bd5); }
    .whatsapp { background: #25d366; }
    .instapay { background: #e21b23; }
    .text strong { display:block; font-size: 16px; }
    .text span { display:block; margin-top:4px; color:#aaa; font-size:12px; }
    .arrow { margin-left:auto; color:#777; font-size:22px; }
    footer {
      margin-top: auto;
      padding-top: 34px;
      color:#666;
      font-size:11px;
      letter-spacing:1.2px;
      text-align:center;
    }
  </style>
</head>
<body>
  <main class="page">
    <!-- Optional: replace this emoji circle with your official logo image if desired -->
    <div class="logo" aria-label="XTREME FIT logo">⚡</div>

    <h1 class="brand">XTREME FIT</h1>
    <p class="tagline">Fitness • Football • Community</p>

    <section class="links">
      <a class="link" href="https://web.facebook.com/extereme.fit" target="_blank" rel="noopener noreferrer">
        <div class="icon facebook">f</div>
        <div class="text"><strong>Facebook</strong><span>Follow our Facebook page</span></div>
        <div class="arrow">›</div>
      </a>

      <a class="link" href="https://www.instagram.com/extreme.fit.eg?stkn=MWRweWZoeXdqeWg4Yw%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer">
        <div class="icon instagram">◎</div>
        <div class="text"><strong>Instagram</strong><span>Follow us on Instagram</span></div>
        <div class="arrow">›</div>
      </a>

      <a class="link" href="https://wa.me/message/4F6UEXIULK4AL1" target="_blank" rel="noopener noreferrer">
        <div class="icon whatsapp">◔</div>
        <div class="text"><strong>WhatsApp</strong><span>Chat with us & book your session</span></div>
        <div class="arrow">›</div>
      </a>

      <a class="link" href="https://ipn.eg/S/ahmed.sabry2029/instapay/9UbtzE" target="_blank" rel="noopener noreferrer">
        <div class="icon instapay">₽</div>
        <div class="text"><strong>InstaPay</strong><span>Pay your subscription</span></div>
        <div class="arrow">›</div>
      </a>
    </section>

    <footer>XTREME FIT • 6 OCTOBER CITY</footer>
  </main>
</body>
</html>
